<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Pay - حاسبة اقساط السيارات </title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <style>
        .border-primary{
            border:1.5px solid #3e0eae !important;}
           .bg-orange {
      background-color: #55519f !important;
      color: white} 
      bg-orange:hover {
        background-color: #5a6d92 !important; }
        .bg-custom-input {
      background-color: #f2f3f5 !important;
    }
       </style>
</head>
<body  class="bg-light >
 <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3 shadow-sm">
    <div  class="container justify-content-center">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-4" href="#">
            <span class="badge bg-warning text-dark fs-5 p-2 rounded-circle"> 🚗%</span>
            <span>Drive pay</span>
        </a>
    </div>
 </nav>
<main class="container d-flex justify-content-centeralign-items-center my-5"> 
    <div class="card border-primary rounded-4 p-4shadow-sm bg-white" style="max-width: 550px; width:100%;"> 
        <div class="card-body p-2> 
            <form class="row g-3 text-center" id="installmentForm">
              <div class="col-6">
            <label for="carBrand" class="form-label fw-bold text-secondary fs-6 mb-2">ماركة السيارة</label>
            <input type="text" class="form-control text-center bg-custom-input border-1" id="carBrand" placeholder="هيونداى">
          </div>

          <div class="col-6">
            <label for="carModel" class="form-label fw-bold text-secondary fs-6 mb-2">موديل السيارة</label>
            <input type="text" class="form-control text-center bg-custom-input border-1" id="carModel" placeholder="توسان">
          </div> 
          <div class="col-6">
            <label for="carPrice" class="form-label fw-bold text-secondary fs-6 mb-2">سعر السيارة (ج.م)</label>
            <input type="number" class="form-control text-center bg-custom-input border-1" id="carPrice" placeholder="1000000">
          </div>
          <div class="col-6">
            <label for="downPayment" class="form-label fw-bold text-secondary fs-6 mb-2">قيمة المقدم (ج.م)</label>
            <input type="number" class="form-control text-center bg-custom-input border-1" id="downPayment" placeholder="300000">
          </div>
          <div class="col-12">
            <label for="loanTerm" class="form-label fw-bold text-secondary fs-6 mb-2">مدة التقسيط</label>
            <select class="form-select text-center bg-custom-input border-1 text-muted" id="loanTerm">
              <option value="" selected disabled>اختر مدة التقسيط ...</option>
              <option value="12">12 شهر (سنة)</option>
              <option value="24">24 شهر (سنتين)</option>
              <option value="36">36 شهر (3 سنوات)</option>
              <option value="60">60 شهر (5 سنوات)</option>
            </select>
          </div>
          <div class="col-12 mt-4 d-flex justify-content-center">
            <button type="button" class="btn bg-orange rounded-pill px-5 py-2 fw-bold fs-5" onclick="calculateInstallment()">احسب القسط</button>
          </div>

        </form>
        <div class="mt-4 p-3 bg-light rounded-3 border border-secondary text-center" id="resultCard">
  <h5 class="fw-bold text-dark mb-3">نتيجة الحساب</h5>
  <div class="d-flex justify-content-between px-3 py-1 border-bottom">
    <span class="fw-bold text-secondary">نسبة الفائدة:</span>
    <span class="fw-bold text-primary" id="interestOutput">10%</span>
  </div>
  <div class="d-flex justify-content-between px-3 py-1 mt-2">
    <span class="fw-bold text-secondary">القسط الشهري:</span>
    <span class="fw-bold text-success fs-5" id="monthlyOutput">15,000 ج.م</span>
  </div>
</div>
      </div>
    </div>
  </main>
  <script src="app.js"> </script>
    </body>
</html>
